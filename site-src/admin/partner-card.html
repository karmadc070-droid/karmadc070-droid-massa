<!doctype html>
<!-- 호텔·레지던스 제휴 파트너의 객실용 테이블 스탠드 카드(A6, ?size=A5)를 QR 과 함께 그려 인쇄·PDF 로 저장하는 페이지 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>massa 제휴 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+KR:wght@400;600;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style id="pagesize">@page { size: 105mm 148mm; margin: 0; }</style>
<style>
:root { --teal:#1F4E5F; --teal-deep:#143643; --teal-pale:#E9F0F1; --paper:#FBF9F6; --ink:#1B2528; --soft:#5C6A6D; --gold:#B8863B; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #DDE3E4; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif; color: var(--ink); }
.bar { display: flex; gap: 8px; justify-content: center; padding: 14px; font-size: 14px; }
.bar button { font: inherit; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--teal); background: #fff; color: var(--teal); cursor: pointer; }
.bar button.on { background: var(--teal); color: #fff; }
.sheet { width: 105mm; height: 148mm; margin: 0 auto 24px; background: var(--paper); position: relative; overflow: hidden;
         display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 8px 30px rgba(20,54,67,.18); }
.a5 .sheet { zoom: 1.41; }
.top { width: 100%; background: var(--teal); color: #fff; padding: 6mm 6mm 5mm; }
.mark { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 9.5mm; font-weight: 600; letter-spacing: .4mm; line-height: 1; }
.mark i { color: var(--gold); font-style: normal; }
.tag { font-size: 2.4mm; letter-spacing: .5mm; opacity: .8; margin-top: 1.2mm; text-transform: uppercase; }
.h { margin-top: 5mm; padding: 0 6mm; }
.h1 { font-family: 'Noto Serif KR', serif; font-size: 6.2mm; font-weight: 600; color: var(--teal-deep); line-height: 1.25; word-break: keep-all; }
.h2 { font-size: 4.1mm; font-weight: 700; color: var(--teal); margin-top: 1.4mm; }
.h3 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 5mm; font-weight: 600; color: var(--gold); margin-top: .6mm; }
.qr { margin-top: 4.5mm; background: #fff; border: .5mm solid var(--teal); border-radius: 4mm; padding: 3mm; width: 44mm; height: 44mm; }
.qr svg { width: 100%; height: 100%; display: block; }
.scan { margin-top: 3mm; font-size: 2.9mm; font-weight: 600; color: var(--teal-deep); line-height: 1.5; }
.sub { margin-top: 1.6mm; font-size: 2.4mm; color: var(--soft); line-height: 1.5; padding: 0 7mm; word-break: keep-all; }
.foot { margin-top: auto; width: 100%; border-top: .3mm solid #E4E0D8; padding: 2.4mm 6mm 3mm; display: flex; justify-content: space-between;
        font-size: 2.3mm; color: var(--soft); }
.foot b { color: var(--teal); font-weight: 600; }
@media print { html, body { background: none; } .bar { display: none; } .sheet { margin: 0; box-shadow: none; } }
</style>
</head>
<body>
<div class="bar"><button data-s="A6" class="on">A6</button><button data-s="A5">A5</button><button id="pr">인쇄 · PDF 저장</button></div>
<div class="sheet">
  <div class="top"><div class="mark">massa<i>.</i></div><div class="tag">Massage · Hanoi</div></div>
  <div class="h">
    <div class="h1">객실로 마사지 부르기</div>
    <div class="h2">Gọi massage tận phòng</div>
    <div class="h3">In-room massage</div>
  </div>
  <div class="qr" id="qr"></div>
  <div class="scan">QR을 찍어 예약하세요<br>Quét mã QR để đặt lịch · Scan to book</div>
  <div class="sub">테라피스트가 객실로 찾아갑니다 · Kỹ thuật viên đến tận phòng · A therapist comes to your room</div>
  <div class="foot"><span id="who"></span><b>app.massaviet.com</b></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// 주소의 code(필수)·name(선택)으로 그린다. 데이터는 읽지 않는다 — 코드가 DB 에 있는지는 관리자 화면에서 확인한다.
const q = new URLSearchParams(location.search);
const code = (q.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const url = 'https://app.massaviet.com/?p=' + code;
const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
const n = qr.getModuleCount(); let d = '';
for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
document.getElementById('qr').innerHTML = '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges"><path fill="#143643" d="' + d + '"/></svg>';
document.getElementById('who').textContent = (q.get('name') ? q.get('name') + ' · ' : '') + code;
document.title = 'massa 제휴 카드 ' + code;
function size(s) {
  // 크롬은 @page 의 A6 이름을 모른다(Letter 로 나온다). 치수로 적는다.
  document.getElementById('pagesize').textContent = '@page { size: ' + (s === 'A5' ? '148mm 210mm' : '105mm 148mm') + '; margin: 0; }';
  document.body.classList.toggle('a5', s === 'A5');
  document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === s));
}
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => size(b.dataset.s));
document.getElementById('pr').onclick = () => print();
if ((q.get('size') || '').toUpperCase() === 'A5') size('A5');
</script>
</body>
</html>
