# Codemagic 클라우드 빌드 — massa iOS App Store (모아학원 검증 파이프라인 이식)
workflows:
  ios-appstore:
    name: massa iOS App Store 빌드·TestFlight 업로드
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: capacitor
    integrations:
      # Codemagic Teams > Integrations 에 등록된 App Store Connect 키 (모아학원과 동일 계정이라 재사용)
      app_store_connect: moahagwon_asc_key
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "app.massa.hanoi"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      # 저장소 루트의 배포본을 그대로 www로 복사 — 웹과 앱의 내용 불일치를 원천 차단
      - name: 웹 자산을 저장소 루트에서 가져오기
        script: |
          rm -rf www && mkdir -p www
          cp ../index.html ../manifest.webmanifest ../sw.js ../privacy.html ../terms.html ../delete-account.html www/
          cp ../*.png ../*.jpg www/ 2>/dev/null || true
          cp -r ../icons www/icons
          rm -f www/masaage1.png www/wag1.png
          ls -la www | head -40
      - name: 의존성 설치
        script: npm install
      - name: 네이티브 기능 번들 생성 + index.html에 주입
        script: |
          npm run build:native
          test -s www/capacitor-native.js || { echo "번들 생성 실패"; exit 1; }
          node -e '
            const fs=require("fs");
            const p="www/index.html";
            let s=fs.readFileSync(p,"utf8");
            const tag="<script src=\"capacitor-native.js\"></script>\n";
            if(!s.includes("capacitor-native.js")){
              if(!s.includes("</head>")) { console.error("</head> 없음"); process.exit(1); }
              s=s.replace("</head>", tag+"</head>");
              fs.writeFileSync(p,s);
            }
            console.log("주입 확인:", s.split("capacitor-native.js").length-1);
          '
      # Capacitor 8은 SPM이 기본이지만 App.xcworkspace가 필요한 build-ipa 때문에 CocoaPods를 쓴다 (모아학원에서 검증)
      - name: iOS 네이티브 프로젝트 생성 + 자산 동기화
        script: |
          npx cap add ios --packagemanager CocoaPods
          test -d ios/App/App.xcworkspace || { echo "App.xcworkspace 없음 — CocoaPods 템플릿 실패"; exit 1; }
          npx @capacitor/assets generate --ios --iconBackgroundColor '#1F4E5F' --splashBackgroundColor '#1F4E5F' || true
          npx cap sync ios
      # 아이폰 알림 토큰 전달 (2026-10-23). Capacitor 푸시 플러그인은 AppDelegate 가 받은 APNs 토큰을
      # NotificationCenter 로 넘겨 줘야 'registration' 이벤트를 낸다(공식 문서의 iOS 필수 설정).
      # cap add ios 템플릿에는 이 두 메서드가 없어서 1.0.19 까지 아이폰 토큰이 한 번도 저장되지 않았다
      # (push_tokens 의 ios 0건). 매 빌드마다 프로젝트를 새로 만드므로 이 단계도 매번 돌아야 한다.
      - name: AppDelegate 에 푸시 토큰 전달 넣기
        script: |
          F=ios/App/App/AppDelegate.swift
          test -f "$F" || { echo "★ AppDelegate.swift 가 없다 - 중단"; exit 1; }
          if ! grep -q capacitorDidRegisterForRemoteNotifications "$F"; then
            cat > /tmp/massa_push.swift <<'SWIFT'

              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          }
          SWIFT
            # 파일 끝의 클래스 닫는 괄호를 두 메서드 + 닫는 괄호로 바꾼다
            ruby -e 's = File.read(ARGV[0]); i = File.read(ARGV[1]); n = s.sub(/\}\s*\z/) { i }; abort("★ 닫는 괄호를 못 찾았다") if n == s; File.write(ARGV[0], n)' "$F" /tmp/massa_push.swift
          fi
          grep -q capacitorDidRegisterForRemoteNotifications "$F" || { echo "★ 토큰 전달 주입 실패 - 중단"; exit 1; }
          grep -q capacitorDidFailToRegisterForRemoteNotifications "$F" || { echo "★ 실패 전달 주입 실패 - 중단"; exit 1; }
          echo "----- AppDelegate 끝부분 -----"
          tail -12 "$F"
      # 알림음 (2026-10-19). 안드로이드는 res/raw 에 복사만 하면 되지만 iOS 는 다르다.
      # APNs 가 aps.sound 로 지정한 파일을 '앱 번들 최상위' 에서 찾는다. 그러려면 Xcode
      # 프로젝트에 리소스로 등록해야 한다 — 파일만 둬서는 번들에 안 들어간다.
      # cap add ios 가 매 빌드마다 프로젝트를 새로 만들므로 이 단계도 매번 돌아야 한다.
      - name: 알림음 넣기 (번들 리소스 등록)
        script: |
          test -f ../capacitor/assets/sound/massa.caf || { echo "★ 알림음 massa.caf 가 없다 - 중단"; exit 1; }
          cp ../capacitor/assets/sound/massa.caf ios/App/App/massa.caf
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" } or abort("★ App 타겟을 못 찾았다")
            group = proj.main_group.find_subpath("App", true)
            unless group.files.any? { |f| f.path == "massa.caf" }
              target.add_resources([group.new_reference("massa.caf")])
            end
            proj.save
            ok = target.resources_build_phase.files.any? { |f| f.file_ref && f.file_ref.path == "massa.caf" }
            abort("★ 번들 리소스 등록 실패") unless ok
            puts "  알림음 등록됨: massa.caf"
          '
      - name: Info.plist 권한 문구 추가 (위치·카메라·사진)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string '내 주변 테라피스트 검색과 방문 서비스 위치 확인에 사용됩니다.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string '내 주변 테라피스트 검색과 방문 서비스 위치 확인에 사용됩니다.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '프로필·서류 사진 촬영에 카메라를 사용합니다.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string '프로필·서류 사진 업로드를 위해 사진 보관함에 접근합니다.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          echo "----- Info.plist 확인 -----"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"
      # 앱은 5개 언어를 쓰는데 번들이 영어 하나만 선언해서 App Store 제품 페이지에
      # '언어: 영어' 로만 떴다. 실제로 지원하는 언어를 선언해 준다.
      - name: 지원 언어 선언 (ko·vi·en·ja·zh)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$PLIST"
          i=0
          for L in ko vi en ja zh-Hans; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:$i string $L" "$PLIST"
            i=$((i+1))
          done
          # 기본 언어도 한국어로 맞춘다. 안 그러면 목록 첫 줄이 영어로 잡힌다.
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ko" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string ko" "$PLIST"
          echo "----- 선언된 언어 -----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleLocalizations" "$PLIST"
      # 소셜 로그인·결제창이 앱으로 돌아올 때 쓰는 전용 주소(massa://).
      # index.html 의 APP_SCHEME 과 반드시 같아야 한다.
      - name: URL 스킴 등록 (massa://)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string app.massa.hanoi" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string massa" "$PLIST"
          echo "----- URL 스킴 확인 -----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"
      # 푸시(APNs)는 entitlements 가 있어야 동작한다. cap add ios 가 만들어주지 않으므로 직접 넣는다.
      - name: entitlements 추가 (푸시)
        script: |
          ENT=ios/App/App/App.entitlements
          if [ ! -f "$ENT" ]; then
            /usr/libexec/PlistBuddy -c "Save" "$ENT"
          fi
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT"
          echo "----- entitlements 확인 -----"
          /usr/libexec/PlistBuddy -c "Print" "$ENT"
          python3 - <<'PY'
          import re
          p = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(p).read()
          if "CODE_SIGN_ENTITLEMENTS" not in s:
              s = s.replace("PRODUCT_BUNDLE_IDENTIFIER =",
                            "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER =")
              open(p, "w").write(s)
              print("CODE_SIGN_ENTITLEMENTS 추가함")
          else:
              print("CODE_SIGN_ENTITLEMENTS 이미 있음")
          PY
      # 서명 파일이 Apple 계정에 없으면 --create 가 인증서와 프로파일을 새로 만든다 (개인키는 Codemagic secure 변수 재사용)
      - name: 서명 인증서·프로파일 확보
        script: |
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "환경변수 CERTIFICATE_PRIVATE_KEY 가 없습니다."
            echo "Codemagic > App settings > Environment variables 에 secure 로 등록하세요."
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --strict-match-identifier \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
      - name: 인증서·프로파일 적용
        script: xcode-project use-profiles
      # app-store-connect 조회는 이 파이프라인에서 항상 0을 반환해 build 1과 중복됐다.
      # Codemagic의 앱별 빌드 카운터(PROJECT_BUILD_NUMBER)는 매 빌드마다 증가하므로 중복이 없다.
      # 마케팅 버전은 capacitor/package.json 의 version 한 곳에서만 관리한다.
      # 이미 출시된 버전 번호로 올리면 "train version is closed" 로 업로드가 거부된다.
      - name: 빌드 번호·마케팅 버전 설정
        script: |
          cd ios/App
          MARKETING=$(node -p "require('../../package.json').version")
          echo "PROJECT_BUILD_NUMBER=$PROJECT_BUILD_NUMBER / 마케팅 버전=$MARKETING"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
          agvtool new-marketing-version "$MARKETING"
      # 계정 화면에 설치된 빌드 번호를 표시해 구버전 테스트로 인한 혼선을 막는다
      - name: 빌드 번호를 index.html에 주입
        script: |
          node -e '
            const fs=require("fs"), p="www/index.html";
            let s=fs.readFileSync(p,"utf8");
            const tag="<script>window.__BUILD__=\"" + process.env.PROJECT_BUILD_NUMBER + "\";</script>\n";
            s=s.replace("</head>", tag+"</head>");
            fs.writeFileSync(p,s);
            console.log("주입된 빌드 번호:", process.env.PROJECT_BUILD_NUMBER);
          '
      - name: 아카이브(IPA) 빌드
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 첫 심사 제출은 App Store Connect 웹에서 수동으로 진행
        submit_to_app_store: false

  # ── 안드로이드 ───────────────────────────────────────────────
  # TWA(웹 껍데기)를 Capacitor 네이티브로 바꾼다. 이유는 하나다 —
  # 웹푸시는 소리·헤드업 배너를 못 낸다. 안드로이드는 '알림 채널'이 그걸 정하는데
  # 웹페이지는 채널 중요도를 건드릴 수 없다. 네이티브면 직접 만들 수 있다.
  # 채널 생성은 앱에서 한다 (native.js registerPush → createChannel, importance 5).
  android-play:
    name: massa Android Play 빌드
    # linux_x2 는 현재 요금제에서 막혀 있다 ("instance type is not available with the current billing plan").
    # iOS 가 쓰는 mac_mini_m2 는 열려 있고, 안드로이드 빌드도 macOS 이미지에서 돈다.
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: capacitor
    environment:
      # 키스토어는 저장소에 없다 (android-package/ 는 .gitignore 에 걸려 있다).
      # Codemagic 의 Code signing identities 에 올려 두고 참조 이름으로 받아 쓴다.
      # 받으면 CM_KEYSTORE_PATH · CM_KEYSTORE_PASSWORD · CM_KEY_ALIAS · CM_KEY_PASSWORD 가 생긴다.
      android_signing:
        - massa_upload_key
      # Play 업로드용 서비스 계정 열쇠 (massa-play-publisher@massa-36da8).
      # Codemagic 의 Environment variables 에 google_play 그룹으로 넣어 둔다.
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "app.massa.hanoi"
      node: 22
      java: 21
    scripts:
      - name: 웹 자산을 저장소 루트에서 가져오기
        script: |
          rm -rf www && mkdir -p www
          cp ../index.html ../manifest.webmanifest ../sw.js ../privacy.html ../terms.html ../delete-account.html www/
          cp ../*.png ../*.jpg www/ 2>/dev/null || true
          cp -r ../icons www/icons
          rm -f www/masaage1.png www/wag1.png
      - name: 의존성 설치
        script: npm install
      - name: 네이티브 기능 번들 생성 + index.html에 주입
        script: |
          npm run build:native
          test -s www/capacitor-native.js || { echo "번들 생성 실패"; exit 1; }
          # sed -i 는 쓰지 않는다. macOS(BSD) sed 는 -i 뒤에 백업 확장자를 요구해서
          # 치환식이 확장자로 먹히고 파일명이 스크립트로 해석된다 (실제로 'sed: ww/index.html' 로 깨졌다).
          grep -q capacitor-native.js www/index.html || perl -pi -e 's#</head>#<script src="capacitor-native.js"></script></head>#' www/index.html
          grep -c capacitor-native.js www/index.html
      - name: 안드로이드 네이티브 프로젝트 생성 + 자산 동기화
        script: |
          npx cap add android
          # ★ 이 단계를 빼면 Play 앱 아이콘이 Capacitor 기본 마크로 바뀐다 (1.1.101 에서 실제로 그랬다).
          #   iOS 워크플로에는 있었는데 안드로이드에만 없었다. assets/icon.png 가 massa 마크다.
          npx @capacitor/assets generate --android --iconBackgroundColor '#1F4E5F' --splashBackgroundColor '#1F4E5F'
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || { echo "★ 아이콘 생성 실패 - 중단"; exit 1; }
          npx cap sync android
      # 알림음 (2026-10-19). 웹푸시로는 소리를 못 냈다 — 네이티브 채널만이 소리를 정한다.
      # 파일 이름은 소문자·숫자·밑줄만 허용된다. 어기면 aapt 가 빌드를 끊는다.
      - name: 알림음 넣기
        script: |
          test -f ../capacitor/assets/sound/massa.wav || { echo "★ 알림음 massa.wav 가 없다 - 중단"; exit 1; }
          mkdir -p android/app/src/main/res/raw
          cp ../capacitor/assets/sound/massa.wav android/app/src/main/res/raw/massa.wav
          test -f android/app/src/main/res/raw/massa.wav || { echo "★ 알림음 복사 실패 - 중단"; exit 1; }
          echo "  알림음 넣음: $(du -h android/app/src/main/res/raw/massa.wav | cut -f1)"
      # URL 스킴 (2026-10-19). iOS 에만 있고 안드로이드에 없었다.
      # 앱은 구글 로그인을 외부 브라우저로 내보내며 redirectTo=massa://auth 로 돌아오라고 한다.
      # 받을 인텐트 필터가 없으면 브라우저가 웹에 머물고, 로그인이 앱이 아니라 웹에서 끝난다.
      # 그러면 앱은 세션이 없어 네이티브 푸시 토큰을 영영 등록하지 못한다 — 알림음이 안 난 진짜 원인.
      - name: URL 스킴 등록 (massa://)
        script: |
          MF=android/app/src/main/AndroidManifest.xml
          test -f "$MF" || { echo "★ AndroidManifest.xml 이 없다 - 중단"; exit 1; }
          python3 - "$MF" <<'PY'
          import sys, re
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          if 'android:scheme="massa"' in s:
              print('  이미 있음'); raise SystemExit
          block = (
            '\n            <intent-filter>\n'
            '                <action android:name="android.intent.action.VIEW" />\n'
            '                <category android:name="android.intent.category.DEFAULT" />\n'
            '                <category android:name="android.intent.category.BROWSABLE" />\n'
            '                <data android:scheme="massa" />\n'
            '            </intent-filter>\n        ')
          # 메인 액티비티의 </activity> 바로 앞에 끼운다
          i = s.find('</activity>')
          if i < 0:
              print('★ </activity> 를 못 찾았다'); raise SystemExit(1)
          s = s[:i] + block + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          print('  massa:// 인텐트 필터 추가')
          PY
          grep -q 'android:scheme="massa"' "$MF" || { echo "★ 스킴 등록 실패 - 중단"; exit 1; }
          echo "----- URL 스킴 확인 -----"
          grep -A1 -B3 'android:scheme="massa"' "$MF"
      - name: Firebase 설정 넣기
        script: |
          test -f ../google-services.json || { echo "★ google-services.json 이 없다 - 중단"; exit 1; }
          cp ../google-services.json android/app/google-services.json
          grep -q 'app.massa.hanoi' android/app/google-services.json || { echo "★ 패키지 이름 불일치 - 중단"; exit 1; }
      - name: 서명 설정
        script: |
          test -f "$CM_KEYSTORE_PATH" || { echo "★ 키스토어가 없다 - Codemagic 의 Code signing identities 에 massa_upload_key 로 올렸는지 확인"; exit 1; }
          printf 'MASSA_STORE_FILE=%s\n' "$CM_KEYSTORE_PATH" >> android/gradle.properties
          printf 'MASSA_STORE_PASSWORD=%s\n' "$CM_KEYSTORE_PASSWORD" >> android/gradle.properties
          printf 'MASSA_KEY_ALIAS=%s\n' "$CM_KEY_ALIAS" >> android/gradle.properties
          printf 'MASSA_KEY_PASSWORD=%s\n' "$CM_KEY_PASSWORD" >> android/gradle.properties
          python3 ../scripts/android-gradle-patch.py
      # ★ CM_BUILD_NUMBER 는 Codemagic 에 없는 변수다. 그래서 항상 기본값 1 이 들어가
      #   버전코드가 매번 101 로 고정됐고, Play 가 "이미 쓴 번호" 라며 거절했다 (2026-10-19).
      #   빌드 번호를 쓰지 않고 Play 에 올라가 있는 최신 번호를 직접 읽어 +1 한다.
      #   이러면 빌드를 어디서 돌리든 번호가 겹치지 않는다.
      - name: 버전 코드 설정
        script: |
          LATEST=$(google-play get-latest-build-number \
            --credentials "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" \
            --package-name "$PACKAGE_NAME")
          case "$LATEST" in ''|*[!0-9]*) echo "★ Play 최신 버전코드를 못 읽었다: '$LATEST'"; exit 1;; esac
          VC=$((LATEST + 1))
          echo "Play 최신=$LATEST -> 이번 빌드=$VC"
          perl -pi -e "s/versionCode .*/versionCode $VC/" android/app/build.gradle
          perl -pi -e "s/versionName .*/versionName \"1.1.$VC\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      # AAB 는 Play 업로드용이고 폰에 직접 설치할 수 없다.
      # 알림 소리·배너를 실제 폰에서 확인하려면 APK 가 있어야 해서 둘 다 만든다.
      - name: AAB·APK 빌드
        script: |
          cd android && ./gradlew bundleRelease assembleRelease
          echo "----- 산출물 -----"
          find app/build/outputs -name '*.aab' -o -name '*.apk'
    # artifact 경로는 working_directory(capacitor) 기준이다.
    # 클론 루트 기준으로 적었다가 산출물이 하나도 안 잡혔다.
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    # 크롬이 .aab 를 끝까지 안 받아 줘서 손으로 올리는 길이 막혔다 (2026-10-19).
    # Codemagic 이 Play 에 직접 올린다. submit_as_draft 라서 자동으로 공개되지는 않고,
    # 프로덕션에 초안으로 올라간다. 게시 버튼은 사람이 누른다.
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: true
